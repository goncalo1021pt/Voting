name: events

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: events-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # No host port mapping: Postgres is reachable only on the internal Compose
    # network (the backend connects via the service name). Add a `ports:` entry
    # back temporarily if you need direct DB access for debugging.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - events-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: events-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - events-network

volumes:
  postgres_data:

networks:
  events-network:
    driver: bridge
