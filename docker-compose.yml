name: events

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: events-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # No host port mapping: Postgres is reachable only on the internal Compose
    # network (the backend connects via the service name). Add a `ports:` entry
    # back temporarily if you need direct DB access for debugging.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - events-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: events-backend
    restart: unless-stopped
    # Debugging only — this is NOT how public traffic arrives. The cloudflared
    # service below reaches the backend over the Compose network at
    # backend:8080, so serving needs no host port at all.
    #
    # Loopback so the LAN cannot bypass Cloudflare's TLS, WAF and rate rules by
    # talking to the app directly, and 8081 because 8080 on this VM belongs to
    # the questboard stack that shares it.
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Optional. Peers whose CF-Connecting-IP header is believed; unset uses
      # loopback + the Docker bridge ranges, which is what cloudflared comes
      # in on. See docs/DEPLOYMENT.md.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Optional. Cross-origin allowlist; empty means same-origin only, which
      # is all the bundled frontend needs.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - events-network
    # /healthz pings the database, so "healthy" means the backend can actually
    # serve — not just that the process is listening. BusyBox wget ships in the
    # alpine runtime image.
    #
    # Note this marks the container unhealthy; it does not restart it. Plain
    # Docker only restarts on exit, not on a failed healthcheck (that's a Swarm
    # feature). The value here is an accurate `docker compose ps`, a signal for
    # monitoring, and a gate for `depends_on: service_healthy`.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The public entrypoint. Dials out to Cloudflare and serves
  # voting.fontao.net from the "voting" tunnel, reaching the backend over this
  # Compose network. No inbound port is opened on the VM or the router.
  #
  # Behind a profile so a plain `make up` on a laptop stays local — a dev
  # machine must not start answering for the production hostname. Production
  # brings it up with `make prod`.
  #
  # TUNNEL_TOKEN is validated by cloudflared at runtime. The ${VAR:-} form
  # keeps compose from failing during global interpolation when it is unset,
  # which would otherwise block unrelated commands like
  # `docker compose up postgres`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: events-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    # Only dial out once /healthz passes, so the tunnel never advertises an
    # origin that cannot serve.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - events-network
    profiles:
      - tunnel

volumes:
  postgres_data:

networks:
  events-network:
    driver: bridge
