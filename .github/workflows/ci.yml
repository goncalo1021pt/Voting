name: CI

on:
  pull_request:
  push:
    branches: [v1]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres so the migration tests actually apply the schema instead of
    # skipping; the rest of the suite doesn't touch the database.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: events_user
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: events_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U events_user -d events_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        working-directory: backend
        run: go vet ./srcs
      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://events_user:testpw@localhost:5432/events_test?sslmode=disable
        run: go test ./srcs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check frontend/app.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose interpolates .env vars into the service config even for build;
      # the example values are fine since nothing runs.
      - name: Provide env
        run: cp .env.example .env
      - name: Build images
        run: docker compose build
