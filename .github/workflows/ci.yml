name: CI

on:
  pull_request:
  push:
    branches: [v1]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        working-directory: backend
        run: go vet ./srcs
      - name: Test
        working-directory: backend
        run: go test ./srcs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check frontend/app.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose interpolates .env vars into the service config even for build;
      # the example values are fine since nothing runs.
      - name: Provide env
        run: cp .env.example .env
      - name: Build images
        run: docker compose build
