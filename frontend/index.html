<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <meta name="description" content="Awards-show style voting for your events.">
    <!-- Fonts live on two extra origins, so warm both connections before the
         stylesheet is even parsed. These used to be pulled in by an @import at
         the top of styles.css, which the browser's preload scanner cannot see:
         it had to fetch styles.css, parse it, open a fresh DNS+TLS connection
         to fonts.googleapis.com, then another to fonts.gstatic.com — four
         serialized round trips before text could render in the right face.
         Declared here, the scanner starts all of it immediately, in parallel
         with styles.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&amp;family=Manrope:wght@300..800&amp;display=swap">
    <link rel="stylesheet" href="/styles.css">
    <script>
        // Set theme before paint to avoid a flash.
        (function () {
            try {
                var stored = localStorage.getItem("events.theme");
                var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>
<body>
    <header class="topbar">
        <a href="#/" class="brand" aria-label="Events home">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="2.5"/>
                    <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="50" y1="6" x2="50" y2="13"/>
                        <line x1="50" y1="87" x2="50" y2="94"/>
                        <line x1="6" y1="50" x2="13" y2="50"/>
                        <line x1="87" y1="50" x2="94" y2="50"/>
                    </g>
                    <path d="M30 33 L50 70 L70 33" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
            </span>
            Events
        </a>
        <nav id="nav" aria-label="Primary"></nav>
        <div class="actions" id="actions"></div>
    </header>
    <main id="view" class="view">
        <p class="muted">Loading…</p>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="/app.js"></script>
</body>
</html>
